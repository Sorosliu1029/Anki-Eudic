[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-eudic"
version = "0.1.0"
description = "Export Eudic study-list words to an Anki deck from a Textual TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "genanki>=0.13.1,<0.14",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "textual>=0.70,<7",
]

[dependency-groups]
dev = ["anki>=26.9", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
anki-eudic = "anki_eudic.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_eudic"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".claude"]
